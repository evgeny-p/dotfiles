---
# Homebrew prefix (Apple Silicon / Intel).
homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"

# fish
fish_set_default_shell: true
fish_apt_use_ppa: true
fish_greeting: ""
fish_environment:
  EDITOR: vim
  VISUAL: vim
  PAGER: less
fish_user_paths:
  - "{{ ansible_facts['user_dir'] }}/.local/bin"
fish_abbreviations:
  g: git
  gs: git status
  gd: git diff
  gl: git log --oneline --graph --decorate
  ga: git add
  gc: git commit
  gco: git checkout
  gp: git pull --rebase
  ll: ls -lah
  "..": cd ..

# MesloLGS NF — the Nerd Font tide recommends. Full Russian alphabet, and
# Cyrillic glyphs keep the Latin advance width, so alignment holds.
fonts_files:
  MesloLGS NF Regular.ttf: d97946186e97f8d7c0139e8983abf40a1d2d086924f2c5dbf1c29bd8f2c6e57d
  MesloLGS NF Bold.ttf: b6c0199cf7c7483c8343ea020658925e6de0aeb318b89908152fcb4d19226003
  MesloLGS NF Italic.ttf: 6f357bcbe2597704e157a915625928bca38364a89c22a4ac36e7a116dcd392ef
  MesloLGS NF Bold Italic.ttf: 56b4131adecec052c4b324efb818dd326d586dbc316fc68f98f1cae2eb8d1220

fish_plugins:
  - IlanCosman/tide@v6.2.0

# Rainbow style, generated by `tide configure` and pinned here. The choices
# on this path skip prompt_connection_andor_frame_color: 'Two lines,
# character' disables both frames and Disconnected leaves the connector
# empty, so tide never asks for that colour.
fish_tide_configure:
  style: Rainbow
  prompt_colors: "True color"
  show_time: "No"
  rainbow_prompt_separators: Angled
  powerline_prompt_heads: Sharp
  powerline_prompt_tails: Flat
  powerline_prompt_style: "Two lines, character"
  prompt_connection: Disconnected
  powerline_right_prompt_frame: "No"
  prompt_spacing: Sparse
  icons: "Few icons"
  transient: "No"
