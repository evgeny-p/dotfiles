---
# Homebrew prefix (Apple Silicon / Intel).
homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"

# fish
fish_set_default_shell: true
fish_apt_use_ppa: true
fish_greeting: ""
fish_environment:
  EDITOR: vim
  VISUAL: vim
  PAGER: less
fish_user_paths:
  - "{{ ansible_facts['user_dir'] }}/.local/bin"
fish_abbreviations:
  g: git
  gs: git status
  gd: git diff
  gl: git log --oneline --graph --decorate
  ga: git add
  gc: git commit
  gco: git checkout
  gp: git pull --rebase
  ll: ls -lah
  "..": cd ..

fish_plugins:
  - IlanCosman/tide@v6.2.0

# Rainbow style, generated by `tide configure` and pinned here. The choices
# on this path skip prompt_connection_andor_frame_color: 'Two lines,
# character' disables both frames and Disconnected leaves the connector
# empty, so tide never asks for that colour.
fish_tide_configure:
  style: Rainbow
  prompt_colors: "True color"
  show_time: "No"
  rainbow_prompt_separators: Angled
  powerline_prompt_heads: Sharp
  powerline_prompt_tails: Flat
  powerline_prompt_style: "Two lines, character"
  prompt_connection: Disconnected
  powerline_right_prompt_frame: "No"
  prompt_spacing: Sparse
  icons: "Few icons"
  transient: "No"
