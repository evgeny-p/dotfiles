---
- name: Assert that the platform is supported
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Darwin', 'Debian']
    fail_msg: "fish role supports macOS and Debian/Ubuntu only, got {{ ansible_facts['os_family'] }}"
    quiet: true

- name: Install fish
  ansible.builtin.include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"

- name: Create fish configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ fish_config_dir }}"
    - "{{ fish_config_dir }}/conf.d"
    - "{{ fish_config_dir }}/functions"
    - "{{ fish_config_dir }}/completions"

- name: Configure fish
  ansible.builtin.import_tasks: config.yml
  when: fish_manage_config | bool

- name: Manage fish plugins
  ansible.builtin.import_tasks: plugins.yml
  when: fish_plugins | length > 0

# The plugins have to be installed before the role configures them.
- name: Install pending plugins
  ansible.builtin.meta: flush_handlers

- name: Configure the tide prompt
  ansible.builtin.import_tasks: tide.yml
  when: fish_tide_configure | length > 0

- name: Set fish as the login shell
  ansible.builtin.import_tasks: shell.yml
  when: fish_set_default_shell | bool
