---
# Location of the fish configuration tree.
fish_config_dir: "{{ ansible_facts['user_dir'] }}/.config/fish"

# Path to the fish binary, depends on how the package was installed.
fish_path: >-
  {{ '/usr/bin/fish'
     if ansible_facts['os_family'] == 'Debian'
     else homebrew_prefix ~ '/bin/fish' }}

# Deploy config.fish and conf.d/*.
fish_manage_config: true

# Make fish the login shell of the current user (requires become).
fish_set_default_shell: false

# Ubuntu: install fish from the upstream PPA instead of the distro repository.
# The distro package lags behind (24.04 ships 3.7), the PPA carries fish 4.
fish_apt_use_ppa: false
fish_apt_ppa: ppa:fish-shell/release-4

# Interactive greeting; an empty string disables it.
fish_greeting: ""

# Environment variables: name -> value.
fish_environment: {}

# Directories prepended to PATH when they exist.
fish_user_paths: []

# Abbreviations: name -> expansion.
fish_abbreviations: {}

# Plugins managed by fisher, pinned to a tag; an empty list turns plugin
# management off entirely. fisher itself must NOT be listed: the role owns
# functions/fisher.fish, and fisher refuses to install over an existing file.
fisher_version: 4.4.8
fish_plugins: []

# Options for a non-interactive `tide configure --auto`; an empty dict skips
# the prompt setup. Every choice on the path of the selected style has to be
# given, otherwise tide aborts with "Missing input for choice".
fish_tide_configure: {}
fish_tide_min_fish_version: "4.0"
fish_tide_state_file: "{{ fish_config_dir }}/.tide-configure-state"
