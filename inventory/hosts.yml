---
# Every machine configures itself over a local connection.
# Personal/work differences belong in group_vars; add the named hosts below
# and run with `--limit <host>` when the split is needed.
all:
  children:
    workstations:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

